    <style>
      .loader {
        width: 100%;
        height: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background-color: var(--color-bg);
        display: grid;
        place-items: center;
        opacity: 1;
        transition: opacity 0.2s linear;
      }

      .loader__circle {
        border-width: 16px;
        border-style: solid;
        border-color: var(--color-main);
        border-top: 16px solid var(--color-bg);
        border-radius: 50%;
        width: 140px;
        height: 140px;
        animation: spin 1s linear infinite;
        font-size: 50px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
